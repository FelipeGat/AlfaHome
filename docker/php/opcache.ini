; PHP guarda o código compilado em memória: sem isso cada página relia e
; recompilava centenas de arquivos do Laravel (lento em disco de servidor).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; O código vem dentro da imagem e só muda num deploy (container novo); o
; cache de views/config em bootstrap/cache e storage é refeito ao subir.
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.save_comments=1
realpath_cache_size=4096K
realpath_cache_ttl=600
