; T-580 — reforço depois da falha PHP2Shell (CVE-2026-109618/109619).
; O Laravel guarda a sessão por conta própria (não usa a sessão nativa do
; PHP), então nada disto muda o login; fecha portas que o sistema não usa.
; Só aceita id de sessão que o próprio PHP criou.
session.use_strict_mode=1
; Desliga o acompanhamento de upload pela sessão (não é usado e foi a porta
; de entrada do ataque).
session.upload_progress.enabled=0
