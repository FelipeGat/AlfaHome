name: Deploy to Production

# Só deploya depois do CI (ci.yml) passar na main — main quebrada não chega
# em produção. workflow_dispatch continua disponível pra deploy manual.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/alfahome
            git pull origin main
            docker exec alfa-home-app php artisan config:cache
            docker exec alfa-home-app php artisan route:cache
            docker exec alfa-home-app php artisan view:cache
            docker exec alfa-home-app php artisan event:cache
            docker compose restart app
            echo "Deploy completed at $(date)"
