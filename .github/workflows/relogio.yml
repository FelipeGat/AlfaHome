name: relogio

# Relógio dos avisos do Telegram: o servidor de produção não tem agendador,
# então este agendamento chama a cada 15 minutos o endereço do relógio da
# família (tela Avisos no Telegram), guardado no segredo ALFAHOME_RELOGIO_URL.
# O GitHub pode atrasar alguns minutos; o sistema decide o que está na hora.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    # Pior caso do curl abaixo: 4 tentativas x 90 s + 3 pausas x 20 s = 420 s (7 min).
    timeout-minutes: 8
    steps:
      - name: Chamar o relógio
        env:
          URL: ${{ secrets.ALFAHOME_RELOGIO_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "Segredo ALFAHOME_RELOGIO_URL não configurado; nada a fazer."
            exit 0
          fi
          # Uma parada curta da produção (ex.: backup do container) não vira falha:
          # tenta de novo até 3 vezes, 20 s entre elas. Repetir é seguro: os avisos
          # têm chave única por pessoa e o envio toma cada linha antes de mandar.
          curl -fsS -X POST --max-time 90 --retry 3 --retry-all-errors --retry-delay 20 \
            -A "alfahome-relogio" "$URL"
