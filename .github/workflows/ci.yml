name: ci

# Roda a suíte (phpunit.local.xml: MySQL em 127.0.0.1, root/root) e publica a
# imagem de assets (vite build) no GHCR. O staging (LXC 104) extrai o
# public/build da imagem em vez de rodar npm build no HDD do alfa-server;
# o deploy de produção (deploy.yml) só dispara depois deste workflow passar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: alfahome_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, pdo_mysql, gd, zip, bcmath, exif, pcntl
          coverage: none
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: build de assets (testes de view exigem o manifest do vite)
        run: npm ci && npm run build
      - name: preparar app de teste
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: phpunit
        run: vendor/bin/phpunit -c phpunit.local.xml

  build-assets:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/assets.Dockerfile
          push: true
          tags: |
            ghcr.io/felipegat/alfahome-assets:sha-${{ github.sha }}
            ghcr.io/felipegat/alfahome-assets:latest
          cache-from: type=gha,scope=assets
          cache-to: type=gha,scope=assets,mode=max
